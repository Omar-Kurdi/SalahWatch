[versions]
# Toolchain
agp = "9.5.2"   # max API 37, needs Gradle 9.6+. Kotlin is built in from AGP 9, so no kotlin-android plugin.
kotlin = "2.4.10"
# KSP2 versions its own line independently of Kotlin. 2.3.10 added Kotlin 2.4 support
# ("Sanitize ':' in internal-name module suffix so KSP works with Kotlin 2.4.0 default
# module names"), so 2.3.11 is the correct pairing for Kotlin 2.4.10 — there is no 2.4.x KSP.
ksp = "2.3.11"
detekt = "1.23.8"

# SDK levels — see RESEARCH.md §1.1
compileSdk = "37"
targetSdk = "37"
minSdkPhone = "29"
minSdkWear = "33"   # Wear OS 4. See RESEARCH.md §1.1 — API 33 is where complication dynamic values begin.

# AndroidX — Wear
wearComplications = "1.3.0"
protolayoutExpression = "1.4.2"
wearCompose = "1.7.2"
wearToolingPreview = "1.0.0"

# AndroidX — general
composeBom = "2026.09.00"   # Compose 1.12.1. 2026.11.01 ships 1.13, which needs compileSdk 37.1
activityCompose = "1.13.0"
appcompat = "1.7.1"
coreKtx = "1.19.1"
lifecycle = "2.10.0"
room = "2.8.4"
datastore = "1.2.1"
work = "2.11.2"

# Play services
playServicesWearable = "20.0.1"
playServicesLocation = "21.4.0"

# Kotlin ecosystem
coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.4.0"
desugarJdkLibs = "2.1.5"

# Prayer calculation — see RESEARCH.md §3
adhan = "0.0.7"

# Test
junit = "4.13.2"

[libraries]
# Wear complications — the core of this app
wear-complications-datasource = { module = "androidx.wear.watchface:watchface-complications-data-source-ktx", version.ref = "wearComplications" }
# Dynamic complication values (DynamicFloat). Pulled in transitively at 1.0.0, which predates the
# schema 1.200 expressions we need, so it is pinned explicitly.
protolayout-expression = { module = "androidx.wear.protolayout:protolayout-expression", version.ref = "protolayoutExpression" }

# Wear UI
wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
wear-tooling-preview = { module = "androidx.wear:wear-tooling-preview", version.ref = "wearToolingPreview" }

# Compose (phone + shared)
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# AndroidX core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Persistence
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Background work
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

# Wearable data layer + location
play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "playServicesWearable" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }

# Kotlin ecosystem
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

# Prayer calculation
adhan = { module = "com.batoulapps.adhan:adhan2", version.ref = "adhan" }

# Gradle plugin artifacts, referenced by the convention plugins in buildSrc
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

# Test
junit = { module = "junit:junit", version.ref = "junit" }
# The JUnit 4 variant, named explicitly. The Kotlin Android plugin used to infer it from the junit
# dependency; AGP 9's built-in Kotlin does not, and without it `kotlin.test.Test` does not exist.
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3-junit4", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
